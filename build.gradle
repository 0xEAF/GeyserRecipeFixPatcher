plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    // Gives us an accurate, Mojang-mapped compile classpath (NMS classes
    // like ServerPlayer/AnvilMenu) for the two Folia helper classes below.
    // Modern Paper (1.20.5+) already ships those Mojang-mapped names at
    // runtime, so no reobfuscation step is needed - this is dev-time only.
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.19'
}

group = 'net.sideways_sky.geyserrecipefixpatcher'
version = '1.0.0b'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

// Compile-only stand-ins for the two GeyserRecipeFix classes our Folia
// helper classes reference by name (see PATCHES.md). They declare only the
// field names/types needed for javac to resolve those references - not any
// of the original plugin's logic - and are never packaged: `stubs.output`
// is only ever added as `compileOnly`, so it never ends up in the built jar.
sourceSets {
    stubs {
        java {
            srcDirs = ['src/stubs/java']
        }
    }
}

dependencies {
    // Note: paperDevBundle already includes the full mapped Paper API, so
    // it replaces a plain paper-api dependency here rather than sitting
    // alongside one (avoids two copies of the Bukkit API on the classpath).
    compileOnly paperweight.paperDevBundle("1.21.8-R0.1-SNAPSHOT")
    compileOnly sourceSets.stubs.output

    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'

    stubsCompileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(targetJavaVersion)
}

// The two Folia helper classes (net/sideways_sky/geyserrecipefix/**) are
// ordinary members of the `main` source set - that's the only way to get
// paperweight's Mojang-mapped NMS classpath applied to them reliably. After
// compileJava runs, copy just those two .class files into
// resources/main/injected/, so at runtime we can read their raw bytes and
// splice them into the freshly downloaded, official GeyserRecipeFix.jar
// (see JarPatcher). shadowJar then excludes their *original* path (see
// below) so they don't also ship as regular classes on our own plugin's
// runtime classpath - only the `injected/` copies do, and those are never
// loaded by our own plugin, only read as bytes.
tasks.register('bundleInjectedClasses', Copy) {
    dependsOn tasks.named('compileJava')
    from tasks.named('compileJava').map { it.destinationDirectory }
    into layout.buildDirectory.dir('resources/main/injected')
    include 'net/sideways_sky/geyserrecipefix/FoliaRuntimeSupport.class'
    include 'net/sideways_sky/geyserrecipefix/events/FoliaAnvilBridge.class'
}

tasks.named('processResources') {
    dependsOn tasks.named('bundleInjectedClasses')
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    // Deliberately NOT relocating org.objectweb.asm here: Shadow 8.3.5's
    // Groovy-based ASM remapper has a bug (MissingMethodException in
    // RelocatorRemapper.mapValue) when it processes invokedynamic
    // instructions - which any class using a lambda emits, including our
    // own plugin classes - while doing a package relocation pass. Skipping
    // relocation avoids that remap pass entirely. This is safe here: Paper
    // gives each plugin its own isolated classloader, so bundling ASM
    // un-relocated in our own jar won't collide with another plugin's copy.
    exclude 'net/sideways_sky/geyserrecipefix/**'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: version)
    }
}
